<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFT 数字藏品项目实战 · 本地课程库</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside id="sidebar">
  <header>
    <h1 title="">本地课程库</h1>
    <p id="course-title"></p>
    <div class="progress-wrap">
      <div class="bar"><i id="bar"></i></div>
      <span id="pct">0%</span>
    </div>
    <input id="search" type="search" placeholder="搜索小节标题…  ( / )" autocomplete="off">
    <div class="tools">
      <button id="btn-mark" class="ghost" title="把当前小节标记为已完成 (M)">标记完成</button>
      <button id="btn-export" class="ghost" title="导出学习进度与笔记">导出进度</button>
    </div>
  </header>
  <nav id="tree"></nav>
  <footer id="stats"></footer>
</aside>

<main>
  <div id="player-box">
    <video id="v" playsinline controls preload="metadata"></video>
    <div id="no-file" hidden>
      <p>该小节文件尚未下载完成。</p>
      <p class="dim">待视频下载结束后，在 <code>_work/</code> 运行 <code>python3 build_web.py</code> 刷新本页数据。</p>
    </div>
  </div>

  <div id="meta">
    <div id="crumbs"></div>
    <h2 id="lesson-title">选择左侧任意小节开始学习</h2>
    <div id="stats-line"></div>

    <div id="controls">
      <button id="prev">← 上一节</button>
      <button id="next" class="primary">下一节 →</button>
      <label class="rate">倍速
        <select id="rate">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1.0×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2.0×</option>
        </select>
      </label>
      <span id="resume-tag" class="tag" hidden>上次看到 <b></b></span>
    </div>

    <section id="notes-sec">
      <div class="sec-head">
        <h3>本节笔记</h3>
        <span id="notes-saved" class="dim"></span>
      </div>
      <textarea id="notes" placeholder="随手记下要点…（自动保存到浏览器本地）"></textarea>
    </section>

    <section id="article-sec" hidden>
      <div class="sec-head"><h3>图文内容</h3></div>
      <div id="article-body"></div>
    </section>

    <details id="keys">
      <summary>快捷键</summary>
      <table>
        <tr><td><kbd>空格</kbd></td><td>播放 / 暂停</td><td><kbd>←</kbd> <kbd>→</kbd></td><td>后退 / 前进 10 秒</td></tr>
        <tr><td><kbd>j</kbd> <kbd>l</kbd></td><td>后退 / 前进 30 秒</td><td><kbd>↑</kbd> <kbd>↓</kbd></td><td>音量 ±5%</td></tr>
        <tr><td><kbd>f</kbd></td><td>全屏</td><td><kbd>m</kbd></td><td>静音</td></tr>
        <tr><td><kbd>n</kbd> <kbd>p</kbd></td><td>下一节 / 上一节</td><td><kbd>c</kbd></td><td>标记 / 取消完成</td></tr>
        <tr><td><kbd>[</kbd> <kbd>]</kbd></td><td>降速 / 提速</td><td><kbd>/</kbd></td><td>聚焦搜索框</td></tr>
      </table>
    </details>
  </div>
</main>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
